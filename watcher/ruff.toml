# dbus-next exige des annotations de signature D-Bus ecrites comme des chaines
# ("s", "a(iiay)", ...). Ruff les voit comme des noms non definis et veut retirer
# les guillemets, ce qui casserait l'introspection D-Bus.
[lint]
ignore = ["BLE001"]

[lint.per-file-ignores]
"src/checkmate_watcher/sni.py" = ["F821", "UP037", "RET501", "F401"]
"src/checkmate_watcher/cli.py" = ["SIM115"]
"tests/test_status_server.py" = ["B010"]
"src/checkmate_watcher/window.py" = ["F401"]
"src/checkmate_watcher/status_server.py" = ["B009"]
