[project]
name = "checkmate-watcher"
version = "0.6.0"
description = "Surveille CESAR Emineo et propose de signer l'emargement des qu'il s'ouvre"
requires-python = ">=3.11"
dependencies = [
  "dbus-next>=0.2.3 ; sys_platform == 'linux'",
  "keyring>=25.7.0",
  "pillow>=13.0.0",
  "platformdirs>=4.14.7",
  "playwright==1.65.1",
  "pystray>=0.19.5",
  "pywebview>=5.4",
  "tomli-w>=1.2.0",
]

[project.scripts]
checkmate-watcher = "checkmate_watcher.cli:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.22.3",
  "pytest>=8",
  "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkmate_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
