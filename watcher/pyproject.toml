[project]
name = "checkmate-watcher"
version = "0.1.0"
description = "Surveille CESAR Emineo et propose de signer l'emargement des qu'il s'ouvre"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.65.1",
]

[project.scripts]
checkmate-watcher = "checkmate_watcher.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkmate_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
