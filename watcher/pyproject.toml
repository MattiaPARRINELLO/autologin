[project]
name = "checkmate-watcher"
version = "0.7.0-beta.4"
description = "Surveille CESAR Emineo et propose de signer l'emargement des qu'il s'ouvre"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mattia Parrinello" }]
requires-python = ">=3.11"
keywords = ["cesar", "emineo", "emargement", "presence", "playwright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: Education",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]

dependencies = [
  "curl-cffi==0.17.0",
  "dbus-next>=0.2.3 ; sys_platform == 'linux'",
  "keyring>=25.7.0",
  "pillow>=13.0.0",
  "platformdirs>=4.14.7",
  "playwright==1.65.2",
  "pystray>=0.19.5",
  "pywebview>=5.4",
  "tomli-w>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/MattiaPARRINELLO/autologin"
Documentation = "https://github.com/MattiaPARRINELLO/autologin/blob/main/watcher/docs/README.md"
Repository = "https://github.com/MattiaPARRINELLO/autologin"
Issues = "https://github.com/MattiaPARRINELLO/autologin/issues"
Releases = "https://github.com/MattiaPARRINELLO/autologin/releases"

[project.scripts]
checkmate-watcher = "checkmate_watcher.cli:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.22.3",
  "pytest>=8",
  "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkmate_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
