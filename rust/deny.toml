# Regles cargo-deny du workspace Rust.
# Documentation : https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "Unlicense",
  # libfuzzer-sys, build-dep transitive de rav1e via image (gpui).
  "NCSA",
  # webpki-roots, donnees de racines TLS utilisees par le client HTTP de gpui.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
