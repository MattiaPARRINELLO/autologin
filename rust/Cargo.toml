[workspace]
resolver = "3"
members = [
  "crates/checkmate-core",
  "crates/checkmate-platform",
  "crates/checkmate-ui",
  "crates/checkmate-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/MattiaPARRINELLO/autologin"
publish = false

[workspace.dependencies]
checkmate-core = { path = "crates/checkmate-core" }
checkmate-platform = { path = "crates/checkmate-platform" }
checkmate-ui = { path = "crates/checkmate-ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
