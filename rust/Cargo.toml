[workspace]
resolver = "3"
members = [
  "crates/checkmate-core",
  "crates/checkmate-platform",
  "crates/checkmate-ui",
  "crates/checkmate-cli",
]

[workspace.package]
version = "0.7.1-beta.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/MattiaPARRINELLO/autologin"
publish = false

[workspace.dependencies]
checkmate-core = { path = "crates/checkmate-core" }
checkmate-platform = { path = "crates/checkmate-platform" }
checkmate-ui = { path = "crates/checkmate-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }
# GPUI est epingle a une version exacte, jamais une branche. Les features
# plateforme sont ajoutees par crate : x11 et wayland sous Linux,
# windows-manifest sous Windows, font-kit partout. Procedure de montee dans
# watcher/docs/architecture.md.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
