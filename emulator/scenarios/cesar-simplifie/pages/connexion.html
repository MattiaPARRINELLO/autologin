<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CESAR Emineo - identification</title>
<link rel="stylesheet" href="/assets/cesar.css">
</head>
<body class="page-login" data-scenario="cesar-simplifie">
<div id="app">
  <section class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">CESAR Emineo</h1>
      <p class="login-hint">Scenario capture. Identifiants de test : demo / demo.</p>
      <form id="login-form" class="login-form" method="post" action="/connexion">
        <div class="form-group">
          <label for="username">Identifiant</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary login-submit">Se connecter</button>
      </form>
    </div>
  </section>
</div>
<script src="/assets/cesar-lib.js"></script>
</body>
</html>
