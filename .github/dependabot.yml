version: 2
updates:
  - package-ecosystem: uv
    directory: /watcher
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-patch:
        patterns:
          - "*"
        update-types:
          - patch
      python-minor:
        patterns:
          - "*"
        update-types:
          - minor
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
