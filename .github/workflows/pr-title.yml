name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verifier le format du titre
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Le titre doit suivre le format conventionnel, par exemple : feat: ajoute un canal beta"
            echo "Prefixes autorises : feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          fi
          echo "Titre valide : $TITLE"
