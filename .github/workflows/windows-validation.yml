name: Windows validation

# Validation complete sur Windows : binaire, emulateur, installeur.
# Lancee a chaque poussee sur beta, et a la demande pour verifier main.
on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: watcher

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dependances
        run: uv sync

      - name: Tests unitaires Windows
        run: uv run pytest -q

      - name: Bundle PyInstaller
        run: uv run pyinstaller packaging/checkmate.spec --noconfirm --clean

      - name: Verifier le binaire
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\CheckMate\CheckMate.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "binaire invalide ($($process.ExitCode))" }
          if (-not (Test-Path ".\dist\CheckMate\_internal\webview")) { throw "pywebview absent du bundle" }
          if (-not (Test-Path ".\dist\CheckMate\_internal\webview\lib\Microsoft.Web.WebView2.Core.dll")) { throw "WebView2 absent du bundle" }

      - name: Demarrer l'emulateur
        shell: pwsh
        working-directory: .
        run: |
          $process = Start-Process python -ArgumentList "emulator/server.py","--port","8899" -WorkingDirectory "$env:GITHUB_WORKSPACE" -PassThru
          $process.Id | Set-Content "$env:RUNNER_TEMP/emulator.pid"
          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:8899/api/state" -TimeoutSec 1 | Out-Null
              Write-Host "emulateur pret"
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          throw "emulateur non demarre"

      - name: Fixture de test
        shell: pwsh
        run: |
          $temp = ($env:RUNNER_TEMP -replace '\\','/')
          @(
            '[cesar]',
            'base_url = "http://127.0.0.1:8899"',
            'username = "demo"',
            'password = "demo"',
            '',
            '[schedule]',
            'enabled = false',
            '',
            '[watcher]',
            'poll_interval = 10',
            'auto_sign = true',
            'auto_sign_delay = 0',
            'headless = true',
            'visible_on_sign = false',
            "profile_dir = `"$temp/profile`"",
            "state_file = `"$temp/state.json`"",
            '',
            '[signature]',
            "file = `"$temp/signature.json`"",
            '',
            '[notifications]',
            'enabled = false'
          ) | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\config.toml"

          '[{"x":10,"y":10,"type":"start"},{"x":60,"y":40,"type":"move"},{"x":120,"y":20,"type":"end"}]' |
            Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\signature.json"

      - name: Pointage complet sur l'emulateur
        shell: pwsh
        run: |
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8899/api/attendance/open" | Out-Null
          $process = Start-Process -FilePath ".\dist\CheckMate\CheckMate.exe" -ArgumentList "--config", "$env:RUNNER_TEMP\config.toml", "run", "--once" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "echec du pointage ($($process.ExitCode))" }
          $state = Invoke-RestMethod -Uri "http://127.0.0.1:8899/api/state"
          if (-not $state.signed) { throw "signature non enregistree" }
          Write-Host "pointage Windows OK"

      - name: Tableau de bord
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\CheckMate\CheckMate.exe" -ArgumentList "--config", "$env:RUNNER_TEMP\config.toml", "run" -PassThru
          try {
            $runtimePath = Join-Path $env:LOCALAPPDATA "checkmate-watcher\runtime.json"
            for ($i = 0; $i -lt 40; $i++) {
              if (Test-Path $runtimePath) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not (Test-Path $runtimePath)) { throw "tableau de bord non demarre" }
            $runtime = Get-Content $runtimePath -Raw | ConvertFrom-Json
            $headers = @{ "X-CheckMate-Token" = $runtime.token }
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:$($runtime.port)/api/status" -Headers $headers
            $versionLine = Select-String -Path "pyproject.toml" -Pattern '^version = "(.+)"'
            $expected = $versionLine.Matches[0].Groups[1].Value
            if ($status.version -ne $expected) { throw "version inattendue : $($status.version), attendue $expected" }
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($runtime.port)/api/action" -Headers $headers -ContentType "application/json" -Body '{"action":"quit"}' | Out-Null
            $process.WaitForExit(30000) | Out-Null
            if (-not $process.HasExited) { throw "CheckMate ne s'est pas arrete" }
            if (Test-Path $runtimePath) { throw "fichier runtime non nettoye" }
            Write-Host "tableau de bord OK"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Notification Windows
        shell: pwsh
        run: |
          $result = uv run python -c "from checkmate_watcher.notifications import Notifier; print(Notifier(platform='win32').send('CheckMate','Validation Windows'))"
          Write-Host $result
          if ($result -notmatch "True") { throw "toast Windows echoue" }

      - name: Credential Manager
        shell: pwsh
        run: |
          uv run python -c "from checkmate_watcher.credentials import set_password,get_password,delete_password; s='checkmate-ci'; u='ci'; assert set_password(s,u,'secret'); assert get_password(s,u)=='secret'; delete_password(s,u); print('keyring OK')"

      - name: Demarrage automatique
        shell: pwsh
        run: |
          uv run checkmate-watcher --config "$env:RUNNER_TEMP\config.toml" install-autostart
          if ($LASTEXITCODE -ne 0) { throw "installation autostart echouee" }
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v CheckMate
          if ($LASTEXITCODE -ne 0) { throw "valeur Run absente" }
          uv run checkmate-watcher --config "$env:RUNNER_TEMP\config.toml" uninstall-autostart
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v CheckMate 2>$null
          if ($LASTEXITCODE -eq 0) { throw "valeur Run encore presente" }
          Write-Host "valeur Run absente, OK"
          exit 0

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construire l'installeur
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=0.1.0" "packaging\checkmate.iss"
          if ($LASTEXITCODE -ne 0) { throw "installeur echoue" }

      - name: Publier l'installeur
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: watcher/dist-installer/*.exe
          if-no-files-found: error

      - name: Arreter l'emulateur
        if: always()
        shell: pwsh
        working-directory: .
        run: |
          if (Test-Path "$env:RUNNER_TEMP/emulator.pid") {
            $emulatorPid = Get-Content "$env:RUNNER_TEMP/emulator.pid"
            Stop-Process -Id $emulatorPid -Force -ErrorAction SilentlyContinue
          }
