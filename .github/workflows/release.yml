name: Release

on:
  push:
    tags:
      - "watcher-v*"

permissions:
  contents: write

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detecter le canal du tag
        id: detect
        env:
          PYTHONPATH: watcher/src
        run: |
          output="$(python3 -m checkmate_watcher.release_channel "$GITHUB_REF_NAME")"
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

      - name: Verifier que le tag vient de la bonne branche
        shell: bash
        env:
          PYTHONPATH: watcher/src
        run: |
          branch="$(python3 -m checkmate_watcher.release_channel "$GITHUB_REF_NAME" | sed -n 's/^branch=//p')"
          channel="$(python3 -m checkmate_watcher.release_channel "$GITHUB_REF_NAME" | sed -n 's/^channel=//p')"
          git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch"; then
            echo "::error::Tag $GITHUB_REF_NAME : un tag $channel doit etre construit depuis la branche $branch."
            exit 1
          fi

  windows:
    needs: channel
    runs-on: windows-latest
    defaults:
      run:
        working-directory: watcher

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dependances
        run: uv sync

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Compiler la coquille GPUI
        working-directory: rust
        run: cargo build --release -p checkmate-cli --bin checkmate-ui

      - name: Bundle PyInstaller
        run: uv run pyinstaller packaging/checkmate.spec --noconfirm --clean

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construire l'installeur
        shell: pwsh
        run: |
          $version = "${{ needs.channel.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\checkmate.iss"

      - name: Publier l'installeur non signe
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: watcher/dist-installer/*.exe
          if-no-files-found: error

      - name: SignPath
        if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publier l'installeur signe
        if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-signed
          path: watcher/signed/**/*.exe
          if-no-files-found: error

  linux:
    needs: channel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dependances
        run: uv sync

      - name: Installer les dependances GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Compiler la coquille GPUI
        working-directory: rust
        run: cargo build --release -p checkmate-cli --bin checkmate-ui

      - name: Archive Linux
        run: bash packaging/build-linux.sh "${{ needs.channel.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-archive
          path: watcher/dist/*.tar.gz
          if-no-files-found: error

  markers:
    runs-on: ubuntu-latest
    outputs:
      manual: ${{ steps.check.outputs.manual }}
    steps:
      - uses: actions/checkout@v7
      - name: Verifier les marqueurs obligatoires
        id: check
        run: bash scripts/check-release-markers.sh

  release:
    needs: [channel, windows, linux, markers]
    runs-on: ubuntu-latest
    environment: ${{ needs.markers.outputs.manual == 'true' && 'release-manual' || 'release-auto' }}

    steps:
      - uses: actions/checkout@v7

      - name: Determiner le statut de la release
        id: meta
        run: |
          version="${GITHUB_REF_NAME#watcher-v}"
          case "$version" in
            *-*) suffix=" beta" ;;
            *) suffix="" ;;
          esac
          echo "name=CheckMate desktop ${version%%-*}$suffix" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Choisir les fichiers et calculer les sommes
        run: |
          mkdir -p release-assets
          signed=$(find artifacts/windows-installer-signed -name '*.exe' 2>/dev/null | head -1 || true)
          if [ -n "$signed" ]; then
            echo "Installeur signe : $signed"
            cp "$signed" release-assets/
          else
            echo "Aucun installeur signe, publication du non signe"
            cp artifacts/windows-installer/*.exe release-assets/
          fi
          cp artifacts/linux-archive/*.tar.gz release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.channel.outputs.prerelease == 'false' }}
          files: release-assets/*

      - name: Ajouter les marqueurs aux notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          summary=$(python3 scripts/release-summary.py "$GITHUB_REF_NAME")
          { cat .github/release-markers.txt; printf '\n%s\n\n%s\n' "$summary" "$body"; } > release-body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-body.md
