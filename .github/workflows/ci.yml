name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: watcher

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer les dependances
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Tests
        run: uv run pytest -q

  lock:
    name: Lockfile (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verifier uv.lock
        run: uv lock --check

  version:
    name: Version alignee
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verifier VERSION et ses copies
        run: python3 scripts/set_version.py --check

  docs:
    name: Docs versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verifier qu'aucune version figee ne reste
        run: python3 scripts/check_doc_versions.py

  stats:
    name: Collecteur de stats
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tests
        run: python -m unittest discover -s stats/tests -v

  ui:
    name: UI Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v7

      - name: Installer les dependances GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Toolchain epinglee
        run: rustup show

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Frontieres des crates
        if: runner.os == 'Linux'
        run: python3 scripts/check-boundaries.py

  rust-audit:
    name: Audit Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Licences, bans et sources
        run: cargo deny check

      - name: Vulnerabilites
        run: cargo audit

  e2e:
    name: E2E emulateur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher
    env:
      CHECKMATE_E2E: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verifier Chromium
        run: command -v google-chrome || command -v chromium

      - name: Installer les dependances
        run: uv sync

      - name: Test de bout en bout
        run: uv run pytest -q -rs tests/test_emulator_e2e.py
